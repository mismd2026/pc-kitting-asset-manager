[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-kitting-asset-manager"
version = "0.1.0"
description = "Windows PC kitting (recovery-image USB + Ansible) with an asset-management DB, job runner, remote desktop and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ansible = ["ansible>=10", "pywinrm>=0.4"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
kit = "assetdb.cli:main"
kit-image = "kitimage.build:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assetdb = ["templates/*.html"]
kitimage = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # Depends() defaults are idiomatic; long lines are Japanese UI text (formatter handles code)
