{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
  <h1>ログイン</h1>
  <p class="muted small">管理者から発行されたAPIトークンを入力してください。</p>
  <form method="post" action="/login">
    <input type="password" name="token" required autocomplete="off" style="width:100%;margin-bottom:12px">
    <button style="width:100%">ログイン</button>
  </form>
</div>
{% endblock %}
